name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Protect the selected toolcache Python
        run: |
          set -euo pipefail
          [[ "$(python -I -S -c 'import sys; print(sys.base_prefix)')" == "$pythonLocation" ]]
          # Hosted toolcache permissions are permissive; constrain only this Python and its parent chain.
          sudo /usr/bin/python3 -I -S -B - "$RUNNER_TOOL_CACHE" "$pythonLocation" "$(id -u)" <<'PY'
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          root, selected = map(Path, sys.argv[1:3])
          runner_uid = int(sys.argv[3])
          if root != Path('/opt/hostedtoolcache') or not re.fullmatch(
              r'/opt/hostedtoolcache/Python/[0-9]+\.[0-9]+\.[0-9]+/x64', str(selected)
          ) or selected.resolve(strict=True) != selected:
              raise SystemExit('Unexpected setup-python installation path')
          paths = []
          for path in (selected, *selected.parents):
              if path == root.parent:
                  break
              paths.append(path)
          for directory, directories, files in os.walk(selected, followlinks=False):
              paths.extend(Path(directory) / name for name in (*directories, *files))
          changes = []
          for path in paths:
              metadata = path.lstat()
              if metadata.st_uid not in {0, runner_uid} or not (
                  stat.S_ISREG(metadata.st_mode) or stat.S_ISDIR(metadata.st_mode)
                  or stat.S_ISLNK(metadata.st_mode)
              ):
                  raise SystemExit('Unexpected setup-python installation ownership or file type')
              if not stat.S_ISLNK(metadata.st_mode) and metadata.st_mode & 0o022:
                  changes.append((path, stat.S_IMODE(metadata.st_mode) & ~0o022))
          for path, mode in changes:
              path.chmod(mode, follow_symlinks=False)
          PY

      - name: Install locked runtime
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          umask 077
          (set -o noclobber; : > .venv.install.lock)
          python -m venv .venv
          .venv/bin/python -m pip --isolated install \
            --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: \
            -r requirements.txt
          .venv/bin/python -m pip check

      - name: Diagnose runtime trust metadata
        # Read-only: keep the actual security gate below unchanged. Do not dump env/config contents.
        run: |
          /usr/bin/python3 -I -S -B - "$GITHUB_WORKSPACE" "$pythonLocation" <<'PY'
          import os
          from pathlib import Path
          import runpy
          import stat
          import sys

          skill, selected = map(Path, sys.argv[1:])
          runtime = skill / '.venv'
          seen = set()

          def describe(path):
              if path in seen:
                  return
              seen.add(path)
              try:
                  metadata = path.lstat()
                  link = repr(os.readlink(path)) if stat.S_ISLNK(metadata.st_mode) else '-'
                  print(f'path={str(path)!r} uid={metadata.st_uid} gid={metadata.st_gid} '
                        f'mode={stat.filemode(metadata.st_mode)} links={metadata.st_nlink} target={link}', flush=True)
              except OSError as error:
                  print(f'path={str(path)!r} error={type(error).__name__}', flush=True)

          print(f'guard effective uid={os.geteuid()}', flush=True)
          for leaf in (skill / 'scripts' / 'runtime_guard.py', selected / 'bin' / 'python',
                       runtime / 'bin' / 'python', runtime / 'pyvenv.cfg', runtime / 'lib64'):
              for path in (leaf, *leaf.parents):
                  describe(path)
              try:
                  resolved = leaf.resolve(strict=True)
                  for path in (resolved, *resolved.parents):
                      describe(path)
              except OSError:
                  pass
          # Print only anomalous tree metadata, never source, credentials, or environment values.
          for root in (skill / 'scripts', runtime):
              for directory, directories, files in os.walk(root, followlinks=False):
                  for name in (*directories, *files):
                      path = Path(directory) / name
                      metadata = path.lstat()
                      if metadata.st_uid not in {0, os.geteuid()} or (
                          not stat.S_ISLNK(metadata.st_mode) and metadata.st_mode & 0o022
                      ):
                          describe(path)
          guard = runpy.run_path(str(skill / 'scripts' / 'runtime_guard.py'))
          for name, path in (('validate_sources', skill), ('validate_runtime', runtime)):
              try:
                  guard[name](path)
              except (ValueError, OSError, KeyError) as error:
                  print(f'{name}: {type(error).__name__}: {error}', flush=True)
              else:
                  print(f'{name}: passed', flush=True)
          PY

      - name: Run offline contract and lifecycle regression gates
        run: |
          set -euo pipefail
          shellcheck_path="$(command -v shellcheck)"
          /bin/bash -p scripts/check.sh --venv --shellcheck "$shellcheck_path"
          git diff --check
